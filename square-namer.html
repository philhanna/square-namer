<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Square Namer — Chess Coordinate Drill</title>
<style>
  :root {
    --light: #e8d5b7;
    --dark: #6b4a34;
    --highlight: #f5c518;
    --correct: #4caf50;
    --wrong: #d9534f;
    --bg: #1c1c1e;
    --panel: #2a2a2d;
    --text: #eee;
    --muted: #999;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 60px;
  }
  h1 {
    font-size: 1.3rem;
    font-weight: 600;
    margin: 0 0 4px;
  }
  .subtitle {
    color: var(--muted);
    font-size: 0.9rem;
    margin-bottom: 18px;
    text-align: center;
  }
  .stats {
    display: flex;
    gap: 18px;
    background: var(--panel);
    padding: 10px 18px;
    border-radius: 10px;
    margin-bottom: 16px;
    font-size: 0.95rem;
  }
  .stats div { text-align: center; }
  .stats .val { font-size: 1.2rem; font-weight: 700; }
  .stats .lbl { color: var(--muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.04em; }

  #board {
    display: grid;
    grid-template-columns: repeat(8, minmax(0, 1fr));
    grid-template-rows: repeat(8, minmax(0, 1fr));
    width: min(92vw, 420px);
    height: min(92vw, 420px);
    border: 3px solid #444;
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 6px 24px rgba(0,0,0,0.5);
  }
  .sq {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .sq.light { background: var(--light); }
  .sq.dark { background: var(--dark); }
  .sq.target { background: var(--highlight) !important; }
  .sq.flash-correct { background: var(--correct) !important; }
  .sq.flash-wrong { background: var(--wrong) !important; }

  #controls {
    margin-top: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    width: min(92vw, 420px);
  }
  #answerForm {
    display: flex;
    gap: 8px;
    width: 100%;
  }
  #answerInput {
    flex: 1;
    font-size: 1.1rem;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid #555;
    background: #111;
    color: var(--text);
    text-align: center;
    letter-spacing: 0.05em;
  }
  #answerInput:focus { outline: 2px solid var(--highlight); }
  button {
    font-size: 1rem;
    padding: 10px 16px;
    border-radius: 8px;
    border: none;
    background: var(--highlight);
    color: #1c1c1e;
    font-weight: 600;
    cursor: pointer;
  }
  button.secondary {
    background: #3a3a3d;
    color: var(--text);
    font-weight: 500;
  }
  #feedback {
    min-height: 22px;
    font-size: 0.95rem;
    font-weight: 600;
  }
  #feedback.correct { color: var(--correct); }
  #feedback.wrong { color: var(--wrong); }

  #toggles {
    display: flex;
    gap: 10px;
    margin-top: 6px;
  }
</style>
</head>
<body>

<h1>Square Namer</h1>
<div class="subtitle">A square lights up — type its name and hit Enter.</div>

<div class="stats">
  <div><div class="val" id="statStreak">0</div><div class="lbl">Streak</div></div>
  <div><div class="val" id="statAcc">—</div><div class="lbl">Accuracy</div></div>
  <div><div class="val" id="statCount">0</div><div class="lbl">Attempts</div></div>
</div>

<div id="board"></div>

<div id="controls">
  <form id="answerForm">
    <input id="answerInput" type="text" maxlength="2" autocomplete="off" autocapitalize="off" placeholder="e.g. e4" />
    <button type="submit">Check</button>
  </form>
  <div id="feedback"></div>
  <div id="toggles">
    <button type="button" class="secondary" id="flipBtn">Flip board (play as Black)</button>
    <button type="button" class="secondary" id="resetBtn">Reset stats</button>
  </div>
</div>

<script>
const files = ['a','b','c','d','e','f','g','h'];
const boardEl = document.getElementById('board');
const answerForm = document.getElementById('answerForm');
const answerInput = document.getElementById('answerInput');
const feedbackEl = document.getElementById('feedback');
const statStreak = document.getElementById('statStreak');
const statAcc = document.getElementById('statAcc');
const statCount = document.getElementById('statCount');
const flipBtn = document.getElementById('flipBtn');
const resetBtn = document.getElementById('resetBtn');

let flipped = false;   // false = White at bottom (standard), true = Black at bottom
let target = null;     // current correct square, e.g. "e4"
let streak = 0;
let correctCount = 0;
let attemptCount = 0;

function squareColor(file, rank) {
  // a1 is dark. file: 0-7 (a-h), rank: 1-8
  const fileIdx = files.indexOf(file);
  return (fileIdx + rank) % 2 === 0 ? 'dark' : 'light';
}

function buildBoard() {
  boardEl.innerHTML = '';
  // Determine row/col order based on orientation.
  // Standard (not flipped): rank 8 at top down to rank 1 at bottom, files a-h left to right.
  const ranks = flipped ? [1,2,3,4,5,6,7,8] : [8,7,6,5,4,3,2,1];
  const fileOrder = flipped ? [...files].reverse() : files;

  ranks.forEach(rank => {
    fileOrder.forEach(file => {
      const sq = document.createElement('div');
      const name = file + rank;
      sq.className = 'sq ' + squareColor(file, rank);
      sq.dataset.square = name;
      boardEl.appendChild(sq);
    });
  });
}

function pickTarget() {
  const file = files[Math.floor(Math.random() * 8)];
  const rank = Math.floor(Math.random() * 8) + 1;
  const name = file + '' + rank;
  // avoid repeating the same square twice in a row
  if (name === target) return pickTarget();
  target = name;
  highlightTarget();
}

function highlightTarget() {
  document.querySelectorAll('.sq').forEach(el => {
    el.classList.remove('target', 'flash-correct', 'flash-wrong');
  });
  const el = document.querySelector(`.sq[data-square="${target}"]`);
  if (el) el.classList.add('target');
}

function updateStats() {
  statStreak.textContent = streak;
  statCount.textContent = attemptCount;
  statAcc.textContent = attemptCount === 0 ? '—' : Math.round((correctCount / attemptCount) * 100) + '%';
}

function flashResult(isCorrect) {
  const el = document.querySelector(`.sq[data-square="${target}"]`);
  if (el) {
    el.classList.remove('target');
    el.classList.add(isCorrect ? 'flash-correct' : 'flash-wrong');
  }
}

answerForm.addEventListener('submit', (e) => {
  e.preventDefault();
  const guess = answerInput.value.trim().toLowerCase();
  if (!guess) return;

  attemptCount++;
  const isCorrect = guess === target;

  if (isCorrect) {
    correctCount++;
    streak++;
    feedbackEl.textContent = 'Correct — ' + target;
    feedbackEl.className = 'correct';
  } else {
    streak = 0;
    feedbackEl.textContent = `Wrong — that was ${target}, you said ${guess || '(blank)'}`;
    feedbackEl.className = 'wrong';
  }

  flashResult(isCorrect);
  updateStats();
  answerInput.value = '';

  setTimeout(() => {
    pickTarget();
  }, isCorrect ? 350 : 900);
});

flipBtn.addEventListener('click', () => {
  flipped = !flipped;
  flipBtn.textContent = flipped ? 'Flip board (play as White)' : 'Flip board (play as Black)';
  buildBoard();
  highlightTarget();
  answerInput.focus();
});

resetBtn.addEventListener('click', () => {
  streak = 0;
  correctCount = 0;
  attemptCount = 0;
  feedbackEl.textContent = '';
  feedbackEl.className = '';
  updateStats();
});

// init
buildBoard();
pickTarget();
updateStats();
answerInput.focus();
</script>

</body>
</html>
