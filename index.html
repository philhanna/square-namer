<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chess Square Namer — Chess Coordinate Drill</title>
<link rel="stylesheet" href="sqname.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1c1c1e">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>

<h1>Chess Square Namer</h1>
<div class="subtitle">A square lights up — type its name and hit Enter.</div>

<div id="topRow">
  <button type="button" id="sessionBtn">Start</button>
  <button type="button" id="pauseBtn" aria-label="Pause" title="Pause" disabled>
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
      <rect x="6" y="4" width="4" height="16" rx="1"/>
      <rect x="14" y="4" width="4" height="16" rx="1"/>
    </svg>
  </button>
  <form id="answerForm">
    <input id="answerInput" type="text" maxlength="2" autocomplete="off" autocapitalize="off" placeholder="e.g. e4" />
  </form>
  <div id="sessionTimer">00:00</div>
  <button type="button" id="voiceBtn" aria-label="Voice input" title="Voice input" aria-pressed="false" hidden>
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
      <rect x="9" y="2" width="6" height="12" rx="3"/>
      <path d="M6 11a1 1 0 0 1 2 0 4 4 0 0 0 8 0 1 1 0 0 1 2 0 6 6 0 0 1-5 5.917V19h2a1 1 0 0 1 0 2H9a1 1 0 0 1 0-2h2v-2.083A6 6 0 0 1 6 11Z"/>
    </svg>
  </button>
  <button type="button" id="settingsBtn" aria-label="Settings" title="Settings">⚙</button>
</div>

<div id="statusRow">
  <div id="feedback"></div>
  <div id="scoreCounts">
    <span class="scoreItem"><span class="scoreVal right" id="statRight">0</span><span class="scoreLbl">right</span></span>
    <span class="scoreItem"><span class="scoreVal wrong" id="statWrong">0</span><span class="scoreLbl">wrong</span></span>
  </div>
</div>

<div id="boardWrap">
  <div class="boardCaption" id="boardCaptionTop">Black</div>
  <div id="boardFrame">
    <div id="rankLabels"></div>
    <div id="boardStage">
      <div id="board"></div>
      <div id="countdownOverlay" hidden></div>
    </div>
    <div id="fileLabels"></div>
  </div>
  <div class="boardCaption" id="boardCaptionBottom">White</div>
</div>

<div id="settingsOverlay" hidden>
  <div id="settingsPanel">
    <h2>Settings</h2>
    <div id="orientation">
      <span class="orientationTitle">Board orientation</span>
      <div class="orientationOptions">
        <label><input type="radio" name="orientation" id="orientationWhite" checked> White</label>
        <label><input type="radio" name="orientation" id="orientationBlack"> Black</label>
      </div>
    </div>
    <label id="timeLimitLabel">
      Per-square time limit (ms)
      <input type="text" inputmode="numeric" pattern="[0-9]*" id="timeLimitInput" value="5000" />
    </label>
    <label id="coordLabelsToggle">
      <input type="checkbox" id="showCoordinates" checked>
      Show rank/file labels
    </label>
    <button type="button" id="settingsCloseBtn">Close</button>
  </div>
</div>

<div id="summaryOverlay" hidden>
  <div id="sessionSummary">
    <h2>Session summary</h2>
    <div id="summaryHeader"></div>
    <div id="summaryStats"></div>
    <div id="summaryTableWrap">
      <table id="summaryTable">
        <thead>
          <tr>
            <th>Square</th>
            <th>Times shown</th>
            <th>Avg time</th>
            <th>Slowest</th>
          </tr>
        </thead>
        <tbody id="summaryBody"></tbody>
      </table>
    </div>
    <button type="button" id="summaryCloseBtn">Close</button>
  </div>
</div>

<script src="sqname.js"></script>
<script>
if ('serviceWorker' in window.navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js');
  });
}
</script>

</body>
</html>
