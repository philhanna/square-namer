<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Square Namer — Chess Coordinate Drill</title>
<link rel="stylesheet" href="sqname.css">
</head>
<body>

<h1>Square Namer</h1>
<div class="subtitle">A square lights up — type its name and hit Enter.</div>

<div id="session">
  <button type="button" id="sessionBtn">Start session</button>
  <div id="sessionTimer">00:00</div>
  <div id="orientation">
    <label><input type="radio" name="orientation" id="orientationWhite" checked> White</label>
    <label><input type="radio" name="orientation" id="orientationBlack"> Black</label>
  </div>
</div>

<div class="stats">
  <div><div class="val" id="statStreak">0</div><div class="lbl">Streak</div></div>
  <div><div class="val" id="statAcc">—</div><div class="lbl">Accuracy</div></div>
  <div><div class="val" id="statCount">0</div><div class="lbl">Attempts</div></div>
</div>

<div id="boardWrap">
  <div class="boardCaption" id="boardCaptionTop">Black</div>
  <div id="board"></div>
  <div class="boardCaption" id="boardCaptionBottom">White</div>
</div>

<div id="controls">
  <form id="answerForm">
    <input id="answerInput" type="text" maxlength="2" autocomplete="off" autocapitalize="off" placeholder="e.g. e4" disabled />
  </form>
  <div id="feedback"></div>
</div>

<div id="sessionSummary" hidden>
  <h2>Session summary</h2>
  <div id="summaryHeader"></div>
  <table id="summaryTable">
    <thead>
      <tr>
        <th>Square</th>
        <th>Attempts</th>
        <th>Accuracy</th>
        <th>Avg time</th>
        <th>Slowest</th>
      </tr>
    </thead>
    <tbody id="summaryBody"></tbody>
  </table>
</div>

<script src="sqname.js"></script>

</body>
</html>
