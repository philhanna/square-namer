<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Square Namer — Chess Coordinate Drill</title>
<link rel="stylesheet" href="sqname.css">
</head>
<body>

<h1>Square Namer</h1>
<div class="subtitle">A square lights up — type its name and hit Enter.</div>

<div class="stats">
  <div><div class="val" id="statStreak">0</div><div class="lbl">Streak</div></div>
  <div><div class="val" id="statAcc">—</div><div class="lbl">Accuracy</div></div>
  <div><div class="val" id="statCount">0</div><div class="lbl">Attempts</div></div>
</div>

<div id="board"></div>

<div id="controls">
  <form id="answerForm">
    <input id="answerInput" type="text" maxlength="2" autocomplete="off" autocapitalize="off" placeholder="e.g. e4" />
    <button type="submit">Check</button>
  </form>
  <div id="feedback"></div>
  <div id="toggles">
    <button type="button" class="secondary" id="flipBtn">Flip board (play as Black)</button>
    <button type="button" class="secondary" id="resetBtn">Reset stats</button>
  </div>
</div>

<script src="sqname.js"></script>

</body>
</html>
